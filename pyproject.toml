[project]
name = "jobs-portal"
version = "0.1.0"
description = "Self-hosted portal over a folder of job position notes, with an MCP server for driving it from an LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["markdown>=3.6"]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[project.scripts]
jobs-mcp = "jobs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_mcp"]
